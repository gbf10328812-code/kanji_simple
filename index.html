<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漢字しらべ</title>
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="漢字しらべ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#fbf8f1; --card:#ffffff; --ink:#1a1a1a; --sub:#555; --line:#d8d2c4;
  --accent:#1f4e79; --accent-ink:#fff; --soft:#e8eef5; --okuri:#8a8a8a;
  --fs:22px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171a; --card:#22252a; --ink:#f2f2f2; --sub:#bbb; --line:#3a3f46;
    --accent:#6fa8dc; --accent-ink:#0d1b2a; --soft:#2b3440; --okuri:#9a9a9a; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:var(--fs);line-height:1.5;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
h1{font-size:1.25em;margin:0;letter-spacing:.05em}
.size{display:flex;gap:6px}
.size button{font-size:.8em;min-width:56px;min-height:48px;border-radius:12px;border:2px solid var(--line);
  background:var(--card);color:var(--ink)}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 12px}
.row{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;font-size:1.4em;padding:14px 16px;border:3px solid var(--accent);
  border-radius:16px;background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none}
input[type=search]::placeholder{color:#999}
.btn{font-size:1.05em;font-weight:700;padding:0 18px;min-height:64px;border:none;border-radius:16px;
  background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:600}
.hint{color:var(--sub);font-size:.85em;margin:8px 2px 0}
h2{font-size:1em;margin:22px 0 10px;padding-left:10px;border-left:6px solid var(--accent)}
.words{display:flex;flex-wrap:wrap;gap:10px}
.word{font-size:1.6em;padding:8px 18px;background:var(--card);border:2px solid var(--line);border-radius:14px;
  color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.word.rare{font-size:1.3em;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.2em,1fr));gap:10px}
.k{aspect-ratio:1/1;font-size:2.6em;background:var(--card);border:2px solid var(--line);border-radius:16px;
  display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.grid .k{font-size:inherit}
.grid .k span{font-size:2.2em;line-height:1}
.more{margin-top:12px;width:100%}
.empty{padding:24px 8px;color:var(--sub)}
.loading{padding:30px 8px;text-align:center;color:var(--sub)}
/* detail */
#detail{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#detail.open{display:block}
.back{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}
.big{font-size:9em;line-height:1.15;text-align:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  background:var(--card);border:2px solid var(--line);border-radius:20px;margin:6px 0 16px}
.big.wordbig{font-size:4.2em;padding:16px 8px;line-height:1.3}
.yomi{font-size:1.5em;color:var(--sub);text-align:center;margin:-8px 0 12px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:baseline}
dt{font-weight:700;white-space:nowrap;font-size:.9em;color:var(--sub)}
dd{margin:0;font-size:1.25em}
dd .r{display:inline-block;margin-right:.8em}
.okuri{color:var(--okuri)}
.tag{display:inline-block;font-size:.75em;padding:2px 10px;border-radius:999px;background:var(--soft);margin-right:6px}
.ex{list-style:none;padding:0;margin:0}
.ex li{display:flex;align-items:baseline;gap:14px;padding:10px 4px;border-bottom:1px solid var(--line)}
.ex .w{font-size:1.5em;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.ex .y{color:var(--sub)}
footer{margin-top:40px;font-size:.6em;color:var(--sub);line-height:1.6}
footer a{color:var(--sub)}
#install{display:none;background:var(--soft);border-radius:14px;padding:12px 14px;margin:6px 0 10px;font-size:.8em}
#install button{margin-top:8px;font-size:1em;min-height:44px;padding:0 14px;border-radius:10px;border:none;
  background:var(--accent);color:var(--accent-ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>漢字しらべ</h1>
    <div class="size" aria-label="文字の大きさ">
      <button id="smaller" aria-label="文字を小さく">小</button>
      <button id="bigger" aria-label="文字を大きく">大</button>
    </div>
  </header>

  <div id="install">
    ホーム画面に追加すると、アプリのように使えます。<br>
    Safari の下にある <b>共有ボタン（□に↑）</b> →「<b>ホーム画面に追加</b>」を押してください。
    <div><button id="installClose">わかった</button></div>
  </div>

  <div class="search">
    <form id="form" class="row" autocomplete="off">
      <input id="q" type="search" inputmode="text" enterkeyhint="search"
        placeholder="ひらがなで入力" aria-label="よみがな" lang="ja">
      <button class="btn" type="submit">しらべる</button>
    </form>
    <div class="row" style="margin-top:8px">
      <button class="btn ghost" id="clear" type="button" style="flex:1;min-height:48px">けす</button>
    </div>
  </div>

  <div id="results"><div class="hint">例：「やま」「がっこう」「はし」と入れて「しらべる」を押します。</div></div>

  <footer>
    漢字・ことばのデータ：KANJIDIC2 / JMdict（© Electronic Dictionary Research and Development Group、
    <a href="https://www.edrdg.org/edrdg/licence.html">CC BY-SA 4.0</a>）。kanjiapi.dev・kanji-data 経由で収録。<br>
    一度ひらくと、インターネットにつながっていなくても使えます。
  </footer>
</div>

<div id="detail" role="dialog" aria-modal="true">
  <div class="wrap">
    <div class="back"><button class="btn ghost" id="backBtn" style="width:100%">← もどる</button></div>
    <div id="detailBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
